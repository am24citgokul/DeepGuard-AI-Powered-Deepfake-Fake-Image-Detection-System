<!-- Video Upload Component with Drag & Drop Preview -->
<div class="dg-dropzone relative p-6 text-center cursor-pointer transition-all duration-200">
  <input
    type="file"
    id="{{ input_id or 'video_file' }}"
    name="{{ input_name or 'video_file' }}"
    accept=".mp4,.avi,.mov,.mkv"
    class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
    {% if required %}required{% endif %}
  />

  <!-- Placeholder State -->
  <div class="upload-placeholder flex flex-col items-center justify-center py-6">
    <div class="h-14 w-14 rounded-2xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400 mb-3 shadow-inner">
      <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="m22 8-6 4 6 4V8Z"/>
        <rect width="14" height="12" x="2" y="6" rx="2" ry="2"/>
      </svg>
    </div>
    <p class="text-sm font-bold text-white mb-1">
      Drop your video here, or <span class="text-blue-400 underline decoration-blue-400/40">Browse Files</span>
    </p>
    <p class="text-xs text-gray-400">
      Supports MP4, AVI, MOV, MKV (up to 100MB)
    </p>
  </div>

  <!-- Preview State (Shown when file is selected) -->
  <div class="file-preview-area hidden flex flex-col items-center justify-center py-2 z-20 relative">
    <div class="h-16 w-16 rounded-xl bg-blue-500/10 border border-blue-500/30 flex items-center justify-center text-blue-400 mb-3">
      <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
    </div>
    
    <div class="flex items-center gap-3 bg-gray-800/80 px-4 py-2 rounded-lg border border-gray-700">
      <div class="text-left">
        <p class="file-name-display text-xs font-semibold text-white truncate max-w-[200px]">video.mp4</p>
        <p class="file-size-display text-[10px] text-gray-400 font-mono">0 KB</p>
      </div>
      <button type="button" class="btn-remove-file text-gray-400 hover:text-rose-400 p-1 transition-colors" title="Remove File">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>
</div>
