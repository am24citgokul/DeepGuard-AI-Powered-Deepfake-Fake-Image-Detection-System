<!-- Image Upload Component with Drag & Drop & Live Thumbnail Preview -->
<div class="dg-dropzone relative p-6 text-center cursor-pointer transition-all duration-200">
  <input
    type="file"
    id="{{ input_id or 'image_file' }}"
    name="{{ input_name or 'image_file' }}"
    accept=".jpg,.jpeg,.png,.webp,.bmp"
    class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
    {% if required %}required{% endif %}
  />

  <!-- Placeholder State -->
  <div class="upload-placeholder flex flex-col items-center justify-center py-6">
    <div class="h-14 w-14 rounded-2xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 mb-3 shadow-inner">
      <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
        <circle cx="9" cy="9" r="2"/>
        <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
      </svg>
    </div>
    <p class="text-sm font-bold text-white mb-1">
      Drop your image here, or <span class="text-cyan-400 underline decoration-cyan-400/40">Browse Files</span>
    </p>
    <p class="text-xs text-gray-400">
      Supports JPG, PNG, WEBP, BMP (up to 20MB)
    </p>
  </div>

  <!-- Preview State (Shown when file is selected) -->
  <div class="file-preview-area hidden flex flex-col items-center justify-center py-2 z-20 relative">
    <img src="" alt="Selected Preview" class="img-preview-thumb h-32 w-auto max-w-full rounded-lg object-contain border border-gray-700 mb-3 bg-black/40 shadow-md">
    
    <div class="flex items-center gap-3 bg-gray-800/80 px-4 py-2 rounded-lg border border-gray-700">
      <div class="text-left">
        <p class="file-name-display text-xs font-semibold text-white truncate max-w-[200px]">filename.jpg</p>
        <p class="file-size-display text-[10px] text-gray-400 font-mono">0 KB</p>
      </div>
      <button type="button" class="btn-remove-file text-gray-400 hover:text-rose-400 p-1 transition-colors" title="Remove File">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>
</div>
