<!-- DeepGuard X Main Header -->
<header class="sticky top-0 z-40 flex w-full border-b border-gray-200 bg-white/90 backdrop-blur-md dark:border-gray-800 dark:bg-gray-900/90">
  <div class="flex grow items-center justify-between px-4 py-3 sm:px-6 lg:px-8">
    
    <!-- Left: Hamburger Toggle & Page Breadcrumb -->
    <div class="flex items-center gap-3 sm:gap-4">
      <!-- Sidebar Hamburger Toggle -->
      <button
        @click.stop="sidebarToggle = !sidebarToggle"
        class="flex h-10 w-10 items-center justify-center rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-100 hover:text-gray-900 xl:hidden dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-800 dark:hover:text-white"
        title="Toggle Menu"
      >
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <!-- Breadcrumbs / Page Indicator -->
      <div>
        <div class="flex items-center gap-2 text-xs font-semibold text-gray-500 uppercase tracking-wider dark:text-gray-400">
          <span>DEEPGUARD X</span>
          <span>/</span>
          <span class="text-cyan-600 dark:text-cyan-400">{% block breadcrumb %}Authenticity Verification{% endblock %}</span>
        </div>
        <h1 class="text-lg font-bold text-gray-900 dark:text-white sm:text-xl">
          {% block header_title %}Identity Authenticity Screening{% endblock %}
        </h1>
      </div>
    </div>

    <!-- Right: Telemetry & Controls -->
    <div class="flex items-center gap-3">
      
      <!-- System Telemetry Badge -->
      <div class="hidden md:flex items-center gap-2 rounded-full border border-gray-200 bg-gray-50 px-3 py-1.5 dark:border-gray-800 dark:bg-gray-800/60">
        <span class="h-2 w-2 rounded-full bg-cyan-400 shadow-sm shadow-cyan-400/50"></span>
        <span class="text-xs font-medium text-gray-600 dark:text-gray-300">
          Inference Engine: <strong class="text-gray-900 dark:text-white">Active</strong>
        </span>
      </div>

      <!-- Quick Action: Full Scan -->
      <a
        href="/full-screening"
        class="hidden sm:inline-flex items-center gap-1.5 rounded-lg bg-cyan-600 px-3.5 py-2 text-xs font-bold text-white shadow-sm hover:bg-cyan-500 transition-colors"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span>Full Scan</span>
      </a>

      <!-- Dark Mode Switcher -->
      <button
        type="button"
        @click.prevent="
          darkMode = !darkMode;
          document.documentElement.classList.toggle('dark', darkMode);
          localStorage.setItem('darkMode', JSON.stringify(darkMode));
        "
        class="flex h-10 w-10 items-center justify-center rounded-lg border border-gray-200 bg-white text-gray-500 hover:bg-gray-100 hover:text-gray-700 transition-colors dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
        aria-label="Toggle Theme"
        title="Toggle Light/Dark Theme"
      >
        <!-- Sun icon (shows in dark mode) -->
        <svg class="hidden h-5 w-5 dark:block text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <!-- Moon icon (shows in light mode) -->
        <svg class="h-5 w-5 dark:hidden text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

    </div>
  </div>
</header>
